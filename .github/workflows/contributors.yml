name: Add contributors
on:
  workflow_dispatch: {} 
  schedule:
    - cron:  '20 20 * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  add-contributors:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - uses: BobAnkh/add-contributors@8bd02ce413bee09225ff2f27791ecb78ea273743 # master
      with:
        CONTRIBUTOR: '## Contributors'
        COLUMN_PER_ROW: '6'
        ACCESS_TOKEN: ${{secrets.GITHUB_TOKEN}}
        IMG_WIDTH: '100'
        FONT_SIZE: '14'
        PATH: '/README.md'
        BRANCH: 'contributors/update'
        PULL_REQUEST: 'master'
        COMMIT_MESSAGE: 'docs(README): update contributors'
        AVATAR_SHAPE: 'round'
        IGNORED_CONTRIBUTORS: 'devin-ai-integration'
