name: Test required variable missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/basic
          required: |
            DIRENV_ACTION_TEST
            NOT_EXPORTED_BY_ENVRC
      - name: Assert action failed and exported nothing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing required variable"
            exit 1
          fi
          if [ -n "${DIRENV_ACTION_TEST:-}" ]; then
            echo "FAIL: variables should not be exported when validation fails"
            exit 1
          fi
          echo "PASS"
