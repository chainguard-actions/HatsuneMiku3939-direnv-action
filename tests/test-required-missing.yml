name: Test required - fail when required env var is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install direnv into tool cache
        run: |
          DIRENV_VERSION="2.37.1"
          TOOL_CACHE_DIR="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          INSTALL_DIR="$TOOL_CACHE_DIR/direnv/$DIRENV_VERSION/x64"
          mkdir -p "$INSTALL_DIR"
          curl -sfL "https://github.com/direnv/direnv/releases/download/v${DIRENV_VERSION}/direnv.linux-amd64" \
            -o "$INSTALL_DIR/direnv"
          chmod +x "$INSTALL_DIR/direnv"
          touch "${INSTALL_DIR}.complete"
          echo "direnv pre-installed at $INSTALL_DIR"
          "$INSTALL_DIR/direnv" version

      - name: Create .envrc without the required variable
        run: |
          printf 'export PRESENT_VAR=some_value\n' > "$GITHUB_WORKSPACE/.envrc"

      - id: action
        uses: .
        continue-on-error: true
        with:
          masks: ''
          required: |
            PRESENT_VAR
            MISSING_REQUIRED_VAR
          path: .

      - name: Assert action failed due to missing required variable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required variable is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required variable was missing"
