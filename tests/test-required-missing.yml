name: Test direnv required variables (missing - should fail)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc without the required variable
        run: |
          cat > "$GITHUB_WORKSPACE/.envrc" <<'EOF'
          export PRESENT_VAR=some_value
          EOF

      - id: direnv
        uses: .
        continue-on-error: true
        with:
          masks: ''
          required: |
            PRESENT_VAR
            MISSING_REQUIRED_VAR
          direnvVersion: '2.37.1'
          path: .

      - name: Assert action failed due to missing required variable
        run: |
          echo "outcome: ${{ steps.direnv.outcome }}"
          if [ "${{ steps.direnv.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when required variable is missing, got outcome '${{ steps.direnv.outcome }}'"
            exit 1
          fi
          echo "PASS: action correctly failed when required variable was missing"
