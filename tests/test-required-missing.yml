name: Test required vars missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: direnv
        name: Run direnv action with a required var that is missing
        uses: .
        continue-on-error: true
        with:
          masks: ''
          direnvChecksum: '1f1b93dd6f38523fde26dfac96151ef9d31a374e3005cd3345fb93555ae0c9b5'
          required: |
            MISSING_REQUIRED_VAR
          path: tests/fixtures/missing-required

      - name: Assert action failed due to missing required var
        env:
          OUTCOME: ${{ steps.direnv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required var is missing, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required var was missing"
