name: Test required variables missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: direnv
        uses: .
        continue-on-error: true
        with:
          masks: ''
          required: |
            MISSING_VAR
          direnvVersion: '2.32.3'
          direnvChecksum: 'sha256:c0443e4600e4b93ec253e663fff18b5fb490cc555b1fc72f0ab22beaa2bb9810'
          path: ${{ github.workspace }}/tests/fixtures/missing-required

      - name: Assert action failed due to missing required variable
        env:
          OUTCOME: ${{ steps.direnv.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required variable is missing, got outcome='$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required variable was missing"
