name: Test required variables missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc without the required variable
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/required-missing"
          printf 'export PRESENT_VAR=some_value\n' > "$GITHUB_WORKSPACE/tests/fixtures/required-missing/.envrc"

      - id: action
        uses: .
        continue-on-error: true
        with:
          masks: ''
          required: |
            MISSING_REQUIRED_VAR
          path: tests/fixtures/required-missing

      - name: Assert action failed due to missing required variable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required variable is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required variable was missing"
