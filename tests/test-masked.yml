name: Test masked variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          masks: 'SECRET_VAR'
          path: ${{ github.workspace }}/tests/fixtures/masked

      - name: Assert PUBLIC_VAR is exported
        run: |
          echo "PUBLIC_VAR: $PUBLIC_VAR"
          if [ "$PUBLIC_VAR" != "visible_value" ]; then
            echo "FAIL: expected PUBLIC_VAR=visible_value, got: $PUBLIC_VAR"
            exit 1
          fi
          echo "PASS: PUBLIC_VAR is correct"

      - name: Assert SECRET_VAR is exported (value is masked in logs)
        run: |
          # The value is masked in logs but still accessible as an env var
          if [ -z "$SECRET_VAR" ]; then
            echo "FAIL: SECRET_VAR should be set"
            exit 1
          fi
          echo "PASS: SECRET_VAR is set (value masked)"
