name: Test masks input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc with secrets to mask
        run: |
          cat > "$GITHUB_WORKSPACE/.envrc" << 'EOF'
          export PUBLIC_VAR=visible
          export SECRET_TOKEN=my_secret_value
          export ANOTHER_SECRET=another_secret_value
          EOF

      - id: action
        uses: .
        with:
          masks: 'SECRET_TOKEN,ANOTHER_SECRET'
          direnvVersion: '2.37.1'
          path: '.'

      - name: Assert PUBLIC_VAR is exported and accessible
        run: |
          echo "PUBLIC_VAR: $PUBLIC_VAR"
          if [ "$PUBLIC_VAR" != "visible" ]; then
            echo "FAIL: expected PUBLIC_VAR=visible, got: $PUBLIC_VAR"
            exit 1
          fi
          echo "PASS: PUBLIC_VAR is correct"

      - name: Assert SECRET_TOKEN is exported (masked but still set)
        run: |
          if [ -z "$SECRET_TOKEN" ]; then
            echo "FAIL: expected SECRET_TOKEN to be set even though it is masked"
            exit 1
          fi
          echo "PASS: SECRET_TOKEN is set"

      - name: Assert ANOTHER_SECRET is exported (masked but still set)
        run: |
          if [ -z "$ANOTHER_SECRET" ]; then
            echo "FAIL: expected ANOTHER_SECRET to be set even though it is masked"
            exit 1
          fi
          echo "PASS: ANOTHER_SECRET is set"
