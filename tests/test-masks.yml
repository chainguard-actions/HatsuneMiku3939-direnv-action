name: Test masks feature
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc with secret variables
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/masks"
          printf 'export PUBLIC_VAR=visible_value\nexport SECRET_VAR=super_secret_value\n' > "$GITHUB_WORKSPACE/tests/fixtures/masks/.envrc"

      - id: action
        uses: .
        with:
          masks: 'SECRET_VAR'
          path: tests/fixtures/masks

      - name: Assert PUBLIC_VAR is exported and accessible
        env:
          ACTUAL: ${{ env.PUBLIC_VAR }}
        run: |
          echo "actual PUBLIC_VAR: $ACTUAL"
          if [ "$ACTUAL" != "visible_value" ]; then
            echo "FAIL: expected PUBLIC_VAR='visible_value', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: PUBLIC_VAR is correctly set"

      - name: Assert SECRET_VAR is exported (value is masked in logs but still accessible)
        env:
          ACTUAL: ${{ env.SECRET_VAR }}
        run: |
          echo "actual SECRET_VAR: ***"
          if [ "$ACTUAL" != "super_secret_value" ]; then
            echo "FAIL: SECRET_VAR was not exported correctly"
            exit 1
          fi
          echo "PASS: SECRET_VAR is correctly set and masked"
