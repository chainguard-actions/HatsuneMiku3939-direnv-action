name: Test masks input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: direnv
        uses: .
        with:
          masks: 'SECRET_VAR'
          direnvVersion: '2.32.3'
          direnvChecksum: 'sha256:c0443e4600e4b93ec253e663fff18b5fb490cc555b1fc72f0ab22beaa2bb9810'
          path: tests/fixtures/masks

      - name: Assert PUBLIC_VAR is exported
        run: |
          echo "PUBLIC_VAR: $PUBLIC_VAR"
          if [ "$PUBLIC_VAR" != "public_value" ]; then
            echo "FAIL: expected PUBLIC_VAR='public_value', got '$PUBLIC_VAR'"
            exit 1
          fi
          echo "PASS: PUBLIC_VAR is correct"

      - name: Assert SECRET_VAR is exported (value is masked in logs)
        run: |
          # The value is masked in logs but still accessible in the environment
          if [ -z "$SECRET_VAR" ]; then
            echo "FAIL: SECRET_VAR should be set in the environment"
            exit 1
          fi
          echo "PASS: SECRET_VAR is set (value masked)"
