name: Test direnv fails when required var is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc without the required variable
        run: |
          cat > "$GITHUB_WORKSPACE/.envrc" <<'EOF'
          export PRESENT_VAR=exists
          EOF

      - id: action
        uses: .
        with:
          masks: ''
          required: |
            PRESENT_VAR
            MISSING_VAR
          direnvVersion: '2.37.1'
          path: .
        continue-on-error: true

      - name: Assert action failed due to missing required var
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required var is missing, but outcome was: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required var was missing"
