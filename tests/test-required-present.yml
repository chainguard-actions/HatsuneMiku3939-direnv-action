name: Test direnv required variables present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc with required variables
        run: |
          cat > "$GITHUB_WORKSPACE/.envrc" <<'EOF'
          export REQUIRED_VAR=present_value
          export OPTIONAL_VAR=optional_value
          EOF

      - id: action
        uses: .
        with:
          masks: ''
          required: |
            REQUIRED_VAR
          direnvVersion: '2.37.1'
          path: .

      - name: Assert REQUIRED_VAR is exported
        run: |
          echo "REQUIRED_VAR: $REQUIRED_VAR"
          if [ "$REQUIRED_VAR" != "present_value" ]; then
            echo "FAIL: expected REQUIRED_VAR='present_value', got '$REQUIRED_VAR'"
            exit 1
          fi
          echo "PASS: REQUIRED_VAR is correct"

      - name: Assert OPTIONAL_VAR is also exported
        run: |
          echo "OPTIONAL_VAR: $OPTIONAL_VAR"
          if [ "$OPTIONAL_VAR" != "optional_value" ]; then
            echo "FAIL: expected OPTIONAL_VAR='optional_value', got '$OPTIONAL_VAR'"
            exit 1
          fi
          echo "PASS: OPTIONAL_VAR is correct"
