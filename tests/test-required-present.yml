name: Test required variables present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/basic
          required: |
            DIRENV_ACTION_TEST

            FIXTURE_GREETING
            DIRENV_ACTION_TEST
      - name: Assert step succeeded and variables exported
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          if [ "$DIRENV_ACTION_TEST" != "HatsuneMiku3939" ] || [ "$FIXTURE_GREETING" != "hello world" ]; then
            echo "FAIL: required vars not exported"
            exit 1
          fi
          echo "PASS"
