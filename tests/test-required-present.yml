name: Test required vars present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: direnv
        name: Run direnv action with required vars that are present
        uses: .
        with:
          masks: ''
          direnvChecksum: '1f1b93dd6f38523fde26dfac96151ef9d31a374e3005cd3345fb93555ae0c9b5'
          required: |
            REQUIRED_VAR
            OPTIONAL_VAR
          path: tests/fixtures/required

      - name: Assert REQUIRED_VAR is exported
        run: |
          echo "REQUIRED_VAR: $REQUIRED_VAR"
          if [ "$REQUIRED_VAR" != "present_value" ]; then
            echo "FAIL: expected REQUIRED_VAR=present_value, got '$REQUIRED_VAR'"
            exit 1
          fi
          echo "PASS: REQUIRED_VAR is correct"

      - name: Assert OPTIONAL_VAR is exported
        run: |
          echo "OPTIONAL_VAR: $OPTIONAL_VAR"
          if [ "$OPTIONAL_VAR" != "optional_value" ]; then
            echo "FAIL: expected OPTIONAL_VAR=optional_value, got '$OPTIONAL_VAR'"
            exit 1
          fi
          echo "PASS: OPTIONAL_VAR is correct"
