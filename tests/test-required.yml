name: Test required variables
on:
  workflow_dispatch:
jobs:
  test-required-present:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: direnv
        uses: .
        with:
          masks: ''
          required: |
            DIRENV_ACTION_TEST
            SECRET1
          direnvVersion: '2.37.1'
          path: .
      - name: Assert action succeeded and required vars are exported
        run: |
          echo "DIRENV_ACTION_TEST: $DIRENV_ACTION_TEST"
          if [ "$DIRENV_ACTION_TEST" != "HatsuneMiku3939" ]; then
            echo "FAIL: expected DIRENV_ACTION_TEST=HatsuneMiku3939, got '$DIRENV_ACTION_TEST'"
            exit 1
          fi
          if [ "$SECRET1" != "ULTRA_SECRET1" ]; then
            echo "FAIL: expected SECRET1=ULTRA_SECRET1, got '$SECRET1'"
            exit 1
          fi
          echo "PASS: all required variables are exported"
