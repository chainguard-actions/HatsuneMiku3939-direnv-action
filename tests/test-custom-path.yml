name: Test direnv with custom path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create subdirectory with .envrc
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mysubdir"
          cat > "$GITHUB_WORKSPACE/mysubdir/.envrc" <<'EOF'
          export SUBDIR_VAR=from_subdir
          export SUBDIR_NUM=42
          EOF

      - id: action
        uses: .
        with:
          masks: ''
          direnvVersion: '2.37.1'
          path: mysubdir

      - name: Assert SUBDIR_VAR is set
        run: |
          echo "SUBDIR_VAR: $SUBDIR_VAR"
          if [ "$SUBDIR_VAR" != "from_subdir" ]; then
            echo "FAIL: expected SUBDIR_VAR=from_subdir, got: $SUBDIR_VAR"
            exit 1
          fi
          echo "PASS: SUBDIR_VAR is correct"

      - name: Assert SUBDIR_NUM is set
        run: |
          echo "SUBDIR_NUM: $SUBDIR_NUM"
          if [ "$SUBDIR_NUM" != "42" ]; then
            echo "FAIL: expected SUBDIR_NUM=42, got: $SUBDIR_NUM"
            exit 1
          fi
          echo "PASS: SUBDIR_NUM is correct"
