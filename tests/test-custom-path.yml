name: Test custom path - evaluate .envrc in a subdirectory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install direnv into tool cache
        run: |
          DIRENV_VERSION="2.37.1"
          TOOL_CACHE_DIR="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          INSTALL_DIR="$TOOL_CACHE_DIR/direnv/$DIRENV_VERSION/x64"
          mkdir -p "$INSTALL_DIR"
          curl -sfL "https://github.com/direnv/direnv/releases/download/v${DIRENV_VERSION}/direnv.linux-amd64" \
            -o "$INSTALL_DIR/direnv"
          chmod +x "$INSTALL_DIR/direnv"
          touch "${INSTALL_DIR}.complete"
          echo "direnv pre-installed at $INSTALL_DIR"
          "$INSTALL_DIR/direnv" version

      - name: Create .envrc in a subdirectory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mysubdir"
          printf 'export SUBDIR_VAR=from_subdir\nexport SUBDIR_ANOTHER=subdir_value_456\n' > "$GITHUB_WORKSPACE/mysubdir/.envrc"

      - id: action
        uses: .
        with:
          masks: ''
          path: mysubdir

      - name: Assert SUBDIR_VAR is exported from subdirectory .envrc
        env:
          SUBDIR_VAR: ${{ env.SUBDIR_VAR }}
        run: |
          echo "SUBDIR_VAR: $SUBDIR_VAR"
          if [ "$SUBDIR_VAR" != "from_subdir" ]; then
            echo "FAIL: expected SUBDIR_VAR='from_subdir', got '$SUBDIR_VAR'"
            exit 1
          fi
          echo "PASS: SUBDIR_VAR is correct"

      - name: Assert SUBDIR_ANOTHER is exported from subdirectory .envrc
        env:
          SUBDIR_ANOTHER: ${{ env.SUBDIR_ANOTHER }}
        run: |
          echo "SUBDIR_ANOTHER: $SUBDIR_ANOTHER"
          if [ "$SUBDIR_ANOTHER" != "subdir_value_456" ]; then
            echo "FAIL: expected SUBDIR_ANOTHER='subdir_value_456', got '$SUBDIR_ANOTHER'"
            exit 1
          fi
          echo "PASS: SUBDIR_ANOTHER is correct"
