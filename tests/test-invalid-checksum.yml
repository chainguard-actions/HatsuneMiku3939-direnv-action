name: Test invalid direnvChecksum fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          path: tests/fixtures/basic
          masks: ''
          direnvChecksum: not-a-valid-sha256
      - name: Assert step failed and nothing exported
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for malformed checksum"
            exit 1
          fi
          if [ -n "$FIXTURE_FOO" ]; then
            echo "FAIL: variables should not be exported"
            exit 1
          fi
          echo "PASS"
