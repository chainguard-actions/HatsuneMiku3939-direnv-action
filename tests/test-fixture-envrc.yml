name: Test custom fixture .envrc with masks and required
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          path: tests/fixtures/custom-envrc
          masks: FIXTURE_TOKEN
          required: |
            FIXTURE_VAR
            FIXTURE_WITH_SPACES
            FIXTURE_TOKEN
      - name: Assert fixture variables exported
        run: |
          echo "FIXTURE_VAR=$FIXTURE_VAR"
          echo "FIXTURE_WITH_SPACES=$FIXTURE_WITH_SPACES"
          if [ "$FIXTURE_VAR" != "fixture-value" ]; then
            echo "FAIL: FIXTURE_VAR"
            exit 1
          fi
          if [ "$FIXTURE_WITH_SPACES" != "hello direnv world" ]; then
            echo "FAIL: FIXTURE_WITH_SPACES"
            exit 1
          fi
          if [ "$FIXTURE_TOKEN" != "super-secret-token" ]; then
            echo "FAIL: FIXTURE_TOKEN"
            exit 1
          fi
          if [ -n "$CHILD_ENV" ]; then
            echo "FAIL: CHILD_ENV should not be exported"
            exit 1
          fi
          echo "PASS"
