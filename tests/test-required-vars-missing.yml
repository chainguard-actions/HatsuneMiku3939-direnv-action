name: Test required vars - missing variable fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run direnv-action requiring a variable that is NOT exported
        id: action
        uses: .
        continue-on-error: true
        with:
          masks: ''
          path: tests/fixtures/minimal-envrc
          required: |
            ONLY_THIS_VAR
            THIS_VAR_DOES_NOT_EXIST

      - name: Assert action failed due to missing required variable
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required var is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required variable was missing"
