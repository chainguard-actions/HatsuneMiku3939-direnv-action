name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: direnv
        name: Run direnv action on basic fixture
        uses: .
        with:
          masks: ''
          direnvChecksum: '1f1b93dd6f38523fde26dfac96151ef9d31a374e3005cd3345fb93555ae0c9b5'
          path: tests/fixtures/basic

      - name: Assert MY_TEST_VAR is exported
        run: |
          echo "MY_TEST_VAR: $MY_TEST_VAR"
          if [ "$MY_TEST_VAR" != "hello_world" ]; then
            echo "FAIL: expected MY_TEST_VAR=hello_world, got '$MY_TEST_VAR'"
            exit 1
          fi
          echo "PASS: MY_TEST_VAR is correct"

      - name: Assert ANOTHER_VAR is exported
        run: |
          echo "ANOTHER_VAR: $ANOTHER_VAR"
          if [ "$ANOTHER_VAR" != "test_value" ]; then
            echo "FAIL: expected ANOTHER_VAR=test_value, got '$ANOTHER_VAR'"
            exit 1
          fi
          echo "PASS: ANOTHER_VAR is correct"
