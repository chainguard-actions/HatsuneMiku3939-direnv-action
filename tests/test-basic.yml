name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          masks: ''
          path: ${{ github.workspace }}/tests/fixtures/basic

      - name: Assert MY_VAR is exported
        run: |
          echo "MY_VAR: $MY_VAR"
          if [ "$MY_VAR" != "hello_world" ]; then
            echo "FAIL: expected MY_VAR=hello_world, got: $MY_VAR"
            exit 1
          fi
          echo "PASS: MY_VAR is correct"

      - name: Assert ANOTHER_VAR is exported
        run: |
          echo "ANOTHER_VAR: $ANOTHER_VAR"
          if [ "$ANOTHER_VAR" != "test_value" ]; then
            echo "FAIL: expected ANOTHER_VAR=test_value, got: $ANOTHER_VAR"
            exit 1
          fi
          echo "PASS: ANOTHER_VAR is correct"
