name: Test required variables present
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc with required variables
        run: |
          cat > "$GITHUB_WORKSPACE/.envrc" << 'EOF'
          export DB_HOST=localhost
          export DB_PORT=5432
          export APP_SECRET=supersecret
          EOF

      - id: action
        uses: .
        with:
          masks: 'APP_SECRET'
          direnvVersion: '2.37.1'
          path: '.'
          required: |
            DB_HOST
            DB_PORT
            APP_SECRET

      - name: Assert DB_HOST is exported
        run: |
          echo "DB_HOST: $DB_HOST"
          if [ "$DB_HOST" != "localhost" ]; then
            echo "FAIL: expected DB_HOST=localhost, got: $DB_HOST"
            exit 1
          fi
          echo "PASS: DB_HOST is correct"

      - name: Assert DB_PORT is exported
        run: |
          echo "DB_PORT: $DB_PORT"
          if [ "$DB_PORT" != "5432" ]; then
            echo "FAIL: expected DB_PORT=5432, got: $DB_PORT"
            exit 1
          fi
          echo "PASS: DB_PORT is correct"

      - name: Assert APP_SECRET is exported (value is masked but var is set)
        run: |
          if [ -z "$APP_SECRET" ]; then
            echo "FAIL: expected APP_SECRET to be set"
            exit 1
          fi
          echo "PASS: APP_SECRET is set"
