name: Test direnv with required variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          masks: ''
          required: |
            DIRENV_ACTION_TEST
            SECRET1
            SECRET2
          direnvVersion: '2.37.1'
          path: .

      - name: Assert required vars are exported
        run: |
          echo "DIRENV_ACTION_TEST=$DIRENV_ACTION_TEST"
          if [ "$DIRENV_ACTION_TEST" != "HatsuneMiku3939" ]; then
            echo "FAIL: expected DIRENV_ACTION_TEST=HatsuneMiku3939, got '$DIRENV_ACTION_TEST'"
            exit 1
          fi
          echo "PASS DIRENV_ACTION_TEST"

          if [ "$SECRET1" != "ULTRA_SECRET1" ]; then
            echo "FAIL: expected SECRET1=ULTRA_SECRET1, got '$SECRET1'"
            exit 1
          fi
          echo "PASS SECRET1"

          if [ "$SECRET2" != "VERY_SECRET2" ]; then
            echo "FAIL: expected SECRET2=VERY_SECRET2, got '$SECRET2'"
            exit 1
          fi
          echo "PASS SECRET2"
