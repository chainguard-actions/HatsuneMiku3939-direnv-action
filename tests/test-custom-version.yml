name: Test custom direnv version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          masks: ''
          direnvVersion: '2.35.0'
          path: ${{ github.workspace }}/tests/fixtures/basic

      - name: Assert direnv is installed and variables are exported
        run: |
          echo "MY_VAR: $MY_VAR"
          if [ "$MY_VAR" != "hello_world" ]; then
            echo "FAIL: expected MY_VAR=hello_world, got: $MY_VAR"
            exit 1
          fi
          echo "PASS: custom direnv version installed and variables exported correctly"

      - name: Assert direnv version
        run: |
          DIRENV_VER=$(direnv version)
          echo "direnv version: $DIRENV_VER"
          if [ "$DIRENV_VER" != "2.35.0" ]; then
            echo "FAIL: expected direnv version 2.35.0, got: $DIRENV_VER"
            exit 1
          fi
          echo "PASS: direnv version is correct"
