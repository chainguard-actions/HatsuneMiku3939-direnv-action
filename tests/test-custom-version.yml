name: Test custom direnv version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create .envrc file
        run: |
          cat > .envrc <<'EOF'
          export VERSION_TEST=custom_version_ok
          EOF

      - id: action
        uses: .
        with:
          masks: ''
          direnvVersion: '2.32.3'
          path: .

      - name: Assert VERSION_TEST is exported
        run: |
          echo "VERSION_TEST: $VERSION_TEST"
          if [ "$VERSION_TEST" != "custom_version_ok" ]; then
            echo "FAIL: expected VERSION_TEST='custom_version_ok', got '$VERSION_TEST'"
            exit 1
          fi
          echo "PASS"
