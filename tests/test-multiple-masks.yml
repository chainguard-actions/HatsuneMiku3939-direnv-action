name: Test multiple masks - mask multiple comma-separated variables
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Pre-install direnv into tool cache
        run: |
          DIRENV_VERSION="2.37.1"
          TOOL_CACHE_DIR="${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}"
          INSTALL_DIR="$TOOL_CACHE_DIR/direnv/$DIRENV_VERSION/x64"
          mkdir -p "$INSTALL_DIR"
          curl -sfL "https://github.com/direnv/direnv/releases/download/v${DIRENV_VERSION}/direnv.linux-amd64" \
            -o "$INSTALL_DIR/direnv"
          chmod +x "$INSTALL_DIR/direnv"
          touch "${INSTALL_DIR}.complete"
          echo "direnv pre-installed at $INSTALL_DIR"
          "$INSTALL_DIR/direnv" version

      - name: Create .envrc with multiple variables to mask
        run: |
          printf 'export PUBLIC_INFO=visible_value\nexport SECRET_TOKEN=secret_token_abc\nexport API_KEY=api_key_xyz\nexport DB_PASSWORD=db_pass_123\n' > "$GITHUB_WORKSPACE/.envrc"

      - id: action
        uses: .
        with:
          masks: 'SECRET_TOKEN,API_KEY,DB_PASSWORD'
          path: .

      - name: Assert PUBLIC_INFO is exported and accessible
        env:
          PUBLIC_INFO: ${{ env.PUBLIC_INFO }}
        run: |
          echo "PUBLIC_INFO: $PUBLIC_INFO"
          if [ "$PUBLIC_INFO" != "visible_value" ]; then
            echo "FAIL: expected PUBLIC_INFO='visible_value', got '$PUBLIC_INFO'"
            exit 1
          fi
          echo "PASS: PUBLIC_INFO is correct"

      - name: Assert all masked variables are still set
        env:
          SECRET_TOKEN: ${{ env.SECRET_TOKEN }}
          API_KEY: ${{ env.API_KEY }}
          DB_PASSWORD: ${{ env.DB_PASSWORD }}
        run: |
          # All variables should be set even though they are masked in logs
          FAIL=0
          if [ -z "$SECRET_TOKEN" ]; then
            echo "FAIL: SECRET_TOKEN should be set"
            FAIL=1
          fi
          if [ -z "$API_KEY" ]; then
            echo "FAIL: API_KEY should be set"
            FAIL=1
          fi
          if [ -z "$DB_PASSWORD" ]; then
            echo "FAIL: DB_PASSWORD should be set"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "PASS: all masked variables are set (values masked in logs)"
